name: FAST MICRO V1.0 - US stock virtual $1 risk (NO ALPACA ORDERS)

on:
  schedule:
    # Primary 09:20 NY + recovery 09:30 NY in both US DST seasons.
    # Monday-Friday. Alpaca calendar gate rejects NYSE market holidays.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-micro-virtual-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        shell: bash
        name: Reject weekend and wrong US-DST duplicate schedule
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          NY_NOW=$(TZ=America/New_York date '+%H:%M')
          NY_WEEKDAY=$(TZ=America/New_York date '+%u')
          NY_OFFSET=$(TZ=America/New_York date '+%z')
          HH=${NY_NOW:0:2}
          MM=${NY_NOW:3:2}
          NY_MIN=$((10#$HH * 60 + 10#$MM))
          echo "MICRO gate: New York $NY_NOW, offset $NY_OFFSET, cron $SCHEDULE_CRON"
          if [ "$NY_WEEKDAY" -ge 6 ] || [ "$NY_MIN" -lt 560 ] || [ "$NY_MIN" -ge 960 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$NY_OFFSET:$SCHEDULE_CRON" in
              "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5")
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "MICRO: wrong DST cron (skip duplicate)"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 09:30 to 12:00 NY
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: first
        shell: bash
        run: bash scripts/fast_micro_session.sh

  second-session:
    needs: [preflight, first-session]
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 12:00 to close, including early close
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: second
        shell: bash
        run: bash scripts/fast_micro_session.sh
