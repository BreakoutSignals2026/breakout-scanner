name: FAST MICRO V1.0 - US stock virtual $1 risk (NO ALPACA ORDERS)

on:
  schedule:
    # Restore the original daily launch pair used before the recovery-cron changes.
    # 13:10 UTC is 09:10 NY in EDT; 14:10 UTC is 09:10 NY in EST.
    # The other slot is a backup: concurrency prevents overlapping sessions.
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-micro-virtual-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Check New York session window and accept delayed launches
        shell: bash
        run: |
          set -euo pipefail
          ny_time=$(TZ=America/New_York date +%H:%M)
          ny_weekday=$(TZ=America/New_York date +%u)
          ny_hour=${ny_time%:*}
          ny_minute=${ny_time#*:}
          now_min=$((10#$ny_hour * 60 + 10#$ny_minute))
          echo "NY time=$ny_time weekday=$ny_weekday event=$GITHUB_EVENT_NAME"

          # Use the original local-time gate, without rejecting an arriving
          # backup/delayed run based on its UTC cron or DST-season allowlist.
          # First-session waits for 09:30 NY; scanners enforce the Alpaca calendar.
          allow=false
          if [ "$ny_weekday" -lt 6 ] && [ "$now_min" -lt 960 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$now_min" -ge 540 ]; then
              allow=true
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$now_min" -ge 530 ]; then
              allow=true
            fi
          fi
          echo "Gate: allow=$allow"
          echo "should_run=$allow" >> "$GITHUB_OUTPUT"

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 09:30 to 12:00 NY
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: first
        shell: bash
        run: bash scripts/fast_micro_session.sh

  second-session:
    needs: [preflight, first-session]
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 12:00 to close, including early close
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: second
        shell: bash
        run: bash scripts/fast_micro_session.sh
