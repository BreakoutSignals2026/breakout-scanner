name: CRYPTO Breakout V1.2 - Alpaca PAPER + US/Kraken virtual research 24/7

on:
  # Push smoke test uses SAFE MODE: no new PAPER orders, only reconciliation
  # and public market-data diagnostics. No secrets are printed.
  push:
    paths:
      - "scanner_crypto_v1.py"
      - "crypto_observer_v1.py"
      - "crypto_crossfeed_v1.py"
      - "scripts/crypto_session_loop.sh"
      - "crypto_paper_v1.py"
      - "market_virtual_core.py"
      - ".github/workflows/crypto_scanner.yml"
  schedule:
    # Hourly retry trigger at minute 17 to reduce gaps if GitHub drops
    # the intended handover. Each worker still runs up to 3h45m.
    # Concurrency permits ONE active CRYPTO worker; extra runs remain
    # pending and do NOT write or submit duplicate PAPER orders.
    # GitHub cron is best-effort and may still run late.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      enable_paper_entries:
        description: "Allow NEW orders in Alpaca PAPER (never LIVE)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: crypto-breakout-v1
  # The single explicit smoke restart commit cancels an outdated running version.
  # Routine scheduled runs and ordinary pushes never cancel active PAPER sessions.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[crypto-safe-restart]') }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Run CRYPTO five-minute loop with PAPER state persistence
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Regular scheduled sessions: keep PAPER mode as before, never LIVE.
          ENABLE_CRYPTO_PAPER_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_paper_entries == true && 'true' || 'false') }}
          # Only a specially marked SAFE push performs a short multi-cycle restart.
          # It NEVER enables PAPER entry (the expression above is false on push).
          CRYPTO_SAFE_RESTART: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[crypto-safe-restart]') && 'true' || 'false' }}
          CRYPTO_CONTINUOUS: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[crypto-safe-restart]'))) && 'true' || 'false' }}
        shell: bash
        run: bash scripts/crypto_session_loop.sh
