name: FAST Alpaca Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-scanner
  cancel-in-progress: true

jobs:
  fast-scanner:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run FAST scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner_fast.py

      - name: Save FAST state and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add breakout_state_fast.txt breakout_trades_fast.txt breakout_results_fast.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No FAST files changed."
          else
            git commit -m "Update FAST scanner state"
            git push
          fi
