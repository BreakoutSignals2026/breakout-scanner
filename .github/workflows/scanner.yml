name: Breakout Scanner

on:
  schedule:
    # 09:25 New York
    # 13:25 UTC počas letného času
    # 14:25 UTC počas zimného času
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:

  first-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |

          while true
          do
            NY_TIME=$(TZ=America/New_York date '+%H:%M')
            NY_DAY=$(TZ=America/New_York date '+%u')

            NY_HOUR=${NY_TIME:0:2}
            NY_MIN=${NY_TIME:3:2}
            NY_MINUTES=$((10#$NY_HOUR * 60 + 10#$NY_MIN))

            echo "New York time: $NY_TIME"

            if [ "$NY_DAY" -ge 6 ]; then
              echo "Weekend - US market closed."
              break
            fi

            if [ "$NY_MINUTES" -lt 570 ]; then
              echo "Before US market open."
              sleep 60
              continue
            fi

            if [ "$NY_MINUTES" -ge 925 ]; then
              echo "First session finished at 15:25 New York."
              break
            fi

            echo "======================================"
            echo "BREAKOUT SCANNER V2.5-1"
            echo "New York time: $NY_TIME"
            echo "======================================"

            python scanner_v25_1.py

            echo "Scanner finished."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            touch breakout_trades_v25.txt

            git add \
              breakout_state_v24.txt \
              breakout_trades_v25.txt \
              breakout_results_v25.csv \
              2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update scanner state"
              git push
            fi

            echo "Waiting 5 minutes..."
            sleep 300
          done

  second-session:
    needs: first-session
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |

          while true
          do
            NY_TIME=$(TZ=America/New_York date '+%H:%M')
            NY_DAY=$(TZ=America/New_York date '+%u')

            NY_HOUR=${NY_TIME:0:2}
            NY_MIN=${NY_TIME:3:2}
            NY_MINUTES=$((10#$NY_HOUR * 60 + 10#$NY_MIN))

            echo "New York time: $NY_TIME"

            if [ "$NY_DAY" -ge 6 ]; then
              echo "Weekend - US market closed."
              break
            fi

            if [ "$NY_MINUTES" -lt 925 ]; then
              echo "Waiting for second session..."
              sleep 60
              continue
            fi

            if [ "$NY_MINUTES" -ge 960 ]; then
              echo "US market closed at 16:00 New York."
              break
            fi

            echo "======================================"
            echo "BREAKOUT SCANNER V2.5-1"
            echo "New York time: $NY_TIME"
            echo "======================================"

            python scanner_v25_1.py

            echo "Scanner finished."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            touch breakout_trades_v25.txt

            git add \
              breakout_state_v24.txt \
              breakout_trades_v25.txt \
              breakout_results_v25.csv \
              2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update scanner state"
              git push
            fi

            echo "Waiting 5 minutes..."
            sleep 300
          done
