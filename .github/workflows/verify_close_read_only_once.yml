name: Verify paper account flat after scheduled EOD - read only
on:
  push:
    paths:
      - ".github/workflows/verify_close_read_only_once.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Python requests
        run: python -m pip install requests
      - name: Read positions and open orders from Alpaca PAPER without submitting orders
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          base='https://paper-api.alpaca.markets/v2'
          heads={'APCA-API-KEY-ID':os.environ['ALPACA_API_KEY'],
                 'APCA-API-SECRET-KEY':os.environ['ALPACA_SECRET_KEY']}
          def read(path,params=None):
              r=requests.get(base+path,headers=heads,params=params,timeout=18)
              r.raise_for_status()
              return r.json()
          positions=read('/positions')
          orders=read('/orders',{'status':'open','limit':500,'nested':'false'})
          clock=read('/clock')
          fast=json.loads(Path('breakout_state_fast_v31.json').read_text())
          classic=json.loads(Path('breakout_state_v252.json').read_text())
          print('VERIFIED PAPER account. Alpaca HTTP POST=0 and DELETE=0')
          print('clock_is_open',clock.get('is_open'),'clock_timestamp',clock.get('timestamp'))
          print('open_positions_count',len(positions))
          for p in positions:
              print('OPEN_POSITION',p.get('symbol'),'qty',p.get('qty'),
                    'avg_entry',p.get('avg_entry_price'))
          print('open_orders_count',len(orders))
          for o in orders:
              print('OPEN_ORDER',o.get('symbol'),'type',o.get('type'),
                    'status',o.get('status'),'qty',o.get('qty'),
                    'client_id',o.get('client_order_id'))
          print('tracked_fast_open',[(sym,t['status']) for sym,t in fast['trades'].items() if t['status']!='closed'])
          print('tracked_classic_open',[(t['symbol'],t['status']) for t in classic['trades'].values() if t['status']!='closed'])
          print('READ_ONLY_END')
          PY
