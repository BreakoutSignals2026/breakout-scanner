name: Launch one-shot FAST PAPER test
on:
  push:
    paths:
      - ".github/workflows/launch_fast_paper_test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch explicit one-shot PAPER test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location \
            --output /tmp/dispatch_result --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"one_paper_trade":"true"}}' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/fast_scanner.yml/dispatches")
          echo "FAST one-shot workflow_dispatch HTTP ${status}"
          if [ "${status}" != "204" ]; then
            cat /tmp/dispatch_result
            exit 1
          fi
          echo "Dispatch accepted: one_paper_trade=true."
