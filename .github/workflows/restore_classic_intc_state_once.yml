name: One-time Classic INTC B252 tracked state restore (GET-only Alpaca)
on:
  push:
    paths:
      - ".github/workflows/restore_classic_intc_state_once.yml"

permissions:
  contents: write

jobs:
  verify-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Install requests
        run: python -m pip install requests
      - name: Rebuild missing classic record ONLY if Alpaca confirms exact filled INTC bracket
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import requests

          path=Path('breakout_state_v252.json')
          if path.exists():
              print('Existing Classic state found. ABORT rebuild to preserve existing records.')
              raise SystemExit(0)
          url='https://paper-api.alpaca.markets/v2'
          headers={
            'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY'],
            'APCA-API-SECRET-KEY': os.environ['ALPACA_SECRET_KEY']}
          def get(path, params=None):
              r=requests.get(url+path, headers=headers, params=params, timeout=20)
              r.raise_for_status()
              return r.json()
          past=(datetime.now(timezone.utc)-timedelta(days=8)).isoformat()
          orders=get('/orders',{'status':'all','limit':500,'nested':'true','after':past})
          if len(orders)>=500:
              raise RuntimeError('Truncated Alpaca order history; cannot reconstruct safely.')
          parents=[o for o in orders if str(o.get('client_order_id','')).startswith('B252_')
                 and not str(o.get('client_order_id','')).startswith('B252_EOD_')
                 and not o.get('parent_order_id')]
          expected_cid='B252_INTC_202610221245'
          if len(parents)!=1 or parents[0].get('client_order_id')!=expected_cid:
              raise RuntimeError('Unexpected B252 order history; manual verification needed.')
          parent=parents[0]
          if not (parent.get('symbol')=='INTC' and parent.get('side')=='sell'
                  and parent.get('order_class')=='bracket'
                  and parent.get('status')=='filled'
                  and float(parent.get('qty') or 0)==7
                  and float(parent.get('filled_qty') or 0)==7):
              raise RuntimeError('Classic INTC parent identity, side, qty or status mismatch.')
          entry=float(parent.get('filled_avg_price') or 0)
          if entry<=0:
              raise RuntimeError('No verified INTC fill price.')
          legs=parent.get('legs') or []
          stops=[o for o in legs if o.get('type') in {'stop','stop_limit'}
                 and o.get('status') in {'held','new','accepted'}]
          profits=[o for o in legs if o.get('type')=='limit'
                   and o.get('status') in {'held','new','accepted'}]
          if len(legs)!=2 or len(stops)!=1 or len(profits)!=1:
              raise RuntimeError('INTC bracket stop and target not exactly verifiable.')
          stop, take=stops[0], profits[0]
          stop_price=float(stop.get('stop_price') or 0)
          tp_price=float(take.get('limit_price') or 0)
          for leg in (stop,take):
              if leg.get('side')!='buy' or float(leg.get('qty') or 0)!=7:
                  raise RuntimeError('INTC bracket child qty/side mismatch.')
          if not (stop_price>entry>tp_price):
              raise RuntimeError('Invalid protective price direction for short entry.')
          positions=get('/positions')
          matching=[p for p in positions if p.get('symbol')=='INTC']
          if len(matching)!=1 or float(matching[0].get('qty') or 0)!=-7:
              raise RuntimeError('INTC live position no longer exactly SHORT 7; no restore.')
          open_orders=get('/orders',{'status':'open','limit':500,'nested':'false'})
          # Bracket children can show as non-nested open entries depending on Alpaca endpoint.
          authorized={stop.get('id'),take.get('id'),parent.get('id')}
          foreign=[o for o in open_orders
                   if o.get('symbol')=='INTC' and o.get('id') not in authorized]
          if foreign:
              raise RuntimeError('Foreign order on INTC, cannot attribute position safely.')

          ny=ZoneInfo('America/New_York')
          signal=datetime.strptime('202610221245','%Y%m%d%H%M').replace(tzinfo=ny)
          record={
            'symbol':'INTC', 'side':'SELL',
            'client_id':expected_cid, 'entry_id':parent['id'], 'status':'open',
            'submitted':parent.get('submitted_at') or parent.get('filled_at'),
            'signal_candle':signal.isoformat(), 'reference_entry':entry,
            'stop':stop_price, 'tp':tp_price, 'qty':7,
            'planned_risk':round((stop_price-entry)*7,3),
            'result_logged':False,
            'recovered_from_alpaca_read_only':True
          }
          state={'version':'2.5.2','trades':{expected_cid:record},
                 'cooldown':{'INTC':signal.isoformat()}}
          path.write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Recovered verified B252 Classic INTC state; SHORT 7, parent filled, active stop+TP; NO Alpaca POST/DELETE.')
          print('Stop',stop_price,'TP',tp_price,'parent_id',parent['id'])
          PY
          if [ -f breakout_state_v252.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_v252.json
            git commit -m "Recover verifiable Classic INTC B252 state from Alpaca PAPER order history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
