name: CRYPTO Breakout V1.0 - Alpaca PAPER + independent virtual 24/7

on:
  # Push smoke test uses SAFE MODE: no new PAPER orders, only reconciliation
  # and public market-data diagnostics. No secrets are printed.
  push:
    paths:
      - "scanner_crypto_v1.py"
      - "crypto_observer_v1.py"
      - "crypto_paper_v1.py"
      - "market_virtual_core.py"
      - ".github/workflows/crypto_scanner.yml"
  schedule:
    # Long-running 5min loop; resync every 3h. Avoid the busy minute 00.
    # The next run queues behind the previous one (single PAPER writer).
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      enable_paper_entries:
        description: "Allow NEW orders in Alpaca PAPER (never LIVE)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: crypto-breakout-v1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Run CRYPTO five-minute loop with PAPER state persistence
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Regular scheduled sessions: keep PAPER mode as before, never LIVE.
          ENABLE_CRYPTO_PAPER_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_paper_entries == true && 'true' || 'false') }}
          # Push tests and default manual runs do a SINGLE safe scan, not hours.
          CRYPTO_CONTINUOUS: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        shell: bash
        run: bash scripts/crypto_session_loop.sh
