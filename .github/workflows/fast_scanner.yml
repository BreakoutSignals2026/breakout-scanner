name: FAST Alpaca Scanner V3.3.1 (risk-limited PAPER auto)

on:
  schedule:
    # Temporary schedule diagnostic; date checked again in preflight.
    - cron: "35 15 29 10 *"
    # Restore the original daily launch pair used before the recovery-cron changes.
    # 13:10 UTC is 09:10 NY in EDT; 14:10 UTC is 09:10 NY in EST.
    # The other slot is a backup: concurrency prevents overlapping sessions.
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
  workflow_dispatch:
    inputs:
      one_paper_trade:
        description: "ONE-SHOT PAPER: allow at most one FAST entry (existing protection/EOD stays active)"
        type: boolean
        required: false
        default: false
      full_paper_session:
        description: "MANUAL RECOVERY: resume full PAPER auto trading for this session"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'schedule' && github.event.schedule == '35 15 29 10 *' && format('fast-schedule-probe-{0}', github.run_id) || 'fast-scanner' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      is_probe: ${{ steps.gate.outputs.is_probe }}
    steps:
      - id: gate
        name: Check New York session window and accept delayed launches
        shell: bash
        env:
          IS_PROBE_TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule == '35 15 29 10 *' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "is_probe=false" >> "$GITHUB_OUTPUT"
          if [ "$IS_PROBE_TRIGGER" = "true" ]; then
            if [ "$(date -u +%F)" = "2026-10-29" ]; then
              echo "is_probe=true" >> "$GITHUB_OUTPUT"
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Schedule diagnostic only: trading sessions disabled."
            exit 0
          fi
          ny_time=$(TZ=America/New_York date +%H:%M)
          ny_weekday=$(TZ=America/New_York date +%u)
          ny_hour=${ny_time%:*}
          ny_minute=${ny_time#*:}
          now_min=$((10#$ny_hour * 60 + 10#$ny_minute))
          echo "NY time=$ny_time weekday=$ny_weekday event=$GITHUB_EVENT_NAME"

          # Use the original local-time gate, without rejecting an arriving
          # backup/delayed run based on its UTC cron or DST-season allowlist.
          # First-session waits for 09:30 NY; scanners enforce the Alpaca calendar.
          allow=false
          if [ "$ny_weekday" -lt 6 ] && [ "$now_min" -lt 960 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$now_min" -ge 540 ]; then
              allow=true
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$now_min" -ge 530 ]; then
              allow=true
            fi
          fi
          echo "Gate: allow=$allow"
          echo "should_run=$allow" >> "$GITHUB_OUTPUT"

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # Early-close days can end at 13:00 NY. Hand off at noon, not 14:25.
    timeout-minutes: 230
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Scan from US open until 12:00 New York
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Scheduled PAPER auto; manual runs require explicit one_paper_trade. NEVER LIVE.
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST first-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ] || [ "$NOW_MIN" -ge 720 ]; then
              echo "First-session finished."
              break
            fi
            if [ "$NOW_MIN" -lt 570 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ]; then
              echo "No trading session today."
              break
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done

  second-session:
    needs: [preflight, first-session]
    # Run EOD monitoring after scan failure, but honor explicit workflow cancellation.
    # Avoid always(): it can keep the second job alive when the run was canceled.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # 12:00 -> 16:00 (or early-close time), includes setup and verification.
    timeout-minutes: 285
    steps:
      - name: Checkout latest state from repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Monitor, scan and close FAST trades before actual session end
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST second-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ]; then
              break
            fi
            if [ "$NOW_MIN" -lt 720 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ] || [ "$(date +%s)" -ge "$CLOSE_EPOCH" ]; then
              echo "Exchange session ended or market holiday; final scan done."
              break
            fi
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done

  schedule-probe:
    needs: preflight
    if: ${{ needs.preflight.outputs.is_probe == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm scheduled event reached a runner without starting trading
        shell: bash
        run: |
          echo "FAST SCHEDULE PROBE OK at $(date -u --iso-8601=seconds)"
          echo "No scanner executed and no broker credentials used."
