name: XETRA Five-Minute Feed Integrity Check (READ ONLY)

on:
  push:
    paths:
      - ".github/workflows/xetra_data_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Check XETRA Yahoo historical 5m bars without any orders or state writes
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,time
          from zoneinfo import ZoneInfo
          from collections import Counter
          from market_virtual_core import full_bars
          from equity_candle_guard import verify_contiguous
          from scanner_xetra_v1 import SYMBOLS,yahoo_bars,xetra_session
          # Dynamic, latest available Xetra date; do not fabricate historical
          # candles if the session is still young or today is a weekend.
          current=datetime.now(timezone.utc).astimezone(ZoneInfo("Europe/Berlin"))
          if current.weekday()>=5 or current.time()<time(11,0):
              print("XETRA feed smoke skipped outside a session with 2h of completed bars")
              raise SystemExit(0)
          # Validate a reproducible, fully completed 14:00 Berlin window
          # when the market is closed; otherwise use current closed bars.
          checkpoint=current.replace(hour=14,minute=0,second=0,microsecond=0)
          now=min(current,checkpoint).astimezone(timezone.utc)
          opened,_=xetra_session(now)
          verified=0
          for symbol in SYMBOLS:
              raw=yahoo_bars(symbol,now)
              bars=full_bars(raw,now,5)
              last=bars[-13:]
              offsets=dict(Counter(x["t"].minute%5 for x in last))
              valid,reason=verify_contiguous(bars,key="t",count=13,
                      session_open=opened,allow_fixed_grid_offset=True)
              print(f"{symbol}: bars={len(bars)} latest={bars[-1]['t'] if bars else ''} "
                    f"offsets={offsets} valid={valid} reason={reason}")
              verified+=int(valid)
          print(f"XETRA safe research feed: {verified}/{len(SYMBOLS)} integrity windows valid")
          assert verified>0, "No usable real historical XETRA 5m windows; inspect feed"
          print("LIVE YAHOO TIMESTAMP DIAGNOSTIC (READ-ONLY, NO TRADING)")
          live=datetime.now(timezone.utc)
          if live.astimezone(ZoneInfo("Europe/Berlin")).time()<time(17,30):
              from scanner_xetra_v1 import drop_unstable_tail
              for symbol in SYMBOLS:
                  try:
                      raw=yahoo_bars(symbol,live)
                      opened,_=xetra_session(live)
                      stable,dropped=drop_unstable_tail(raw,live,opened)
                      completed=full_bars(stable,live,5)
                      good,reason=verify_contiguous(completed,key="t",count=13,
                             session_open=opened,allow_fixed_grid_offset=True)
                      print(f"LIVE {symbol}: now={live.isoformat()} raw={len(raw)} "
                            f"last18={[x['t'] for x in raw[-18:]]} "
                            f"dropped={dropped} full={len(completed)} "
                            f"valid={good} reason={reason}",flush=True)
                  except Exception as exc:
                      print(f"LIVE {symbol} diagnostic failure={type(exc).__name__}: {exc}")
          PY
