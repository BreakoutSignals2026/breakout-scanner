name: Breakout Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run breakout scanner
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner_v25_1.py

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== FILE CHECK ==="
          ls -la
          echo "=== TRADES FILE ==="
          ls -l breakout_trades_v25.txt || true
          echo "=== GIT STATUS ==="
          git status --short
          echo "=== GIT TRACKED ==="
          git ls-files breakout_trades_v25.txt

          echo "TEST LINE $(date -u)" > breakout_trades_v25.txt

          echo "=== AFTER WRITE ==="
          ls -l breakout_trades_v25.txt
          cat breakout_trades_v25.txt

          git add -f breakout_trades_v25.txt

          echo "=== AFTER GIT ADD ==="
          git status --short

          git commit -m "Test save breakout trades" || true
          git push
          
