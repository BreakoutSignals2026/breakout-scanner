name: One-time final PAPER STOP and bracket verification (GET only)
on:
  push:
    paths:
      - ".github/workflows/final_read_only_audit_once.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install requests
        run: python -m pip install requests
      - name: Verify live Alpaca PAPER tracked protective orders – NO trading
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          BASE='https://paper-api.alpaca.markets/v2'
          H={'APCA-API-KEY-ID':os.environ['ALPACA_API_KEY'],
             'APCA-API-SECRET-KEY':os.environ['ALPACA_SECRET_KEY']}
          def get(p, params=None):
              r=requests.get(BASE+p, headers=H,params=params,timeout=15)
              r.raise_for_status()
              return r.json()
          positions={x['symbol']:x for x in get('/positions')}
          fast=json.loads(Path('breakout_state_fast_v31.json').read_text())['trades']
          classic=json.loads(Path('breakout_state_v252.json').read_text())['trades']
          errors=[]
          print('ALPACA READ-ONLY VERIFY (NO POST/DELETE)')
          for symbol, record in fast.items():
              if record.get('status')=='closed':
                  continue
              pos=positions.get(symbol)
              trailing=get('/orders/'+record['exit_order_id'])
              cid_ok=trailing.get('client_order_id')==record['exit_cid']
              status=trailing.get('status')
              qty=float(trailing.get('qty') or 0)
              side_expected='sell' if record['side']=='buy' else 'buy'
              posqty=float((pos or {}).get('qty') or 0)
              if pos is None and status=='filled':
                  print('FAST',symbol,'exited; state needs next-cycle reconciliation')
                  continue
              healthy=(pos is not None and cid_ok and status in {'new','accepted','pending_new','stopped'}
                       and trailing.get('type')=='trailing_stop'
                       and trailing.get('side')==side_expected
                       and abs(posqty)==qty
                       and float(trailing.get('trail_percent') or 0)==1.2)
              print('FAST',symbol,'state',record['status'],'position_qty',posqty,
                    'stop_status',status,'stop_qty',qty,'trail',trailing.get('trail_percent'),
                    'exact_state_link',cid_ok,'HEALTHY',healthy)
              if not healthy:
                  errors.append('FAST '+symbol)
          for client_id, rec in classic.items():
              if rec.get('status') in {'closed','rejected','canceled_no_fill'}:
                  continue
              pos=positions.get(rec['symbol'])
              parent=get('/orders/'+rec['entry_id'], {'nested':'true'})
              children=parent.get('legs') or []
              stops=[c for c in children if c.get('type') in {'stop','stop_limit'} and c.get('status') in {'held','new','accepted'}]
              tps=[c for c in children if c.get('type')=='limit' and c.get('status') in {'held','new','accepted'}]
              signed_qty=float((pos or {}).get('qty') or 0)
              ok=(parent.get('client_order_id')==client_id and
                  pos is not None and signed_qty==-float(rec['qty'])
                  and len(stops)==1 and len(tps)==1
                  and stops[0].get('side')=='buy' and tps[0].get('side')=='buy'
                  and float(stops[0].get('stop_price') or 0)==float(rec['stop'])
                  and float(tps[0].get('limit_price') or 0)==float(rec['tp'])
                  and float(stops[0].get('qty') or 0)==float(rec['qty'])
                  and float(tps[0].get('qty') or 0)==float(rec['qty']))
              print('CLASSIC',rec['symbol'],'SHORT',signed_qty,
                    'stop',stops[0].get('stop_price') if stops else None,
                    'stop_status',stops[0].get('status') if stops else None,
                    'target',tps[0].get('limit_price') if tps else None,
                    'target_status',tps[0].get('status') if tps else None,
                    'HEALTHY',ok)
              if not ok:
                  errors.append('CLASSIC '+rec['symbol'])
          print('Untracked account position symbols:',
                sorted(set(positions) - set(fast) - {rec['symbol'] for rec in classic.values()}))
          if errors:
              raise RuntimeError('EXPLICIT MANUAL REVIEW NEEDED: '+', '.join(errors))
          print('AUDIT FINISHED: all currently verified tracked stops/brackets healthy.')
          PY
