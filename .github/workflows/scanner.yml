name: Breakout Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run breakout scanner
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner_v25.py

      - name: Save scanner state
        if: always()
        run: |
          if [ -f breakout_state_v24.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add breakout_state_v24.txt

            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update scanner state"
              git push
            fi
          else
            echo "No state file created."
          fi
