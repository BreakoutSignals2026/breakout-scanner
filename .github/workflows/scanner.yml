name: Breakout Scanner V2.5.2 (PAPER auto)

on:
  schedule:
    # Native GitHub fallback; external dispatcher is the primary 09:20 NY trigger.
    # 13:20 UTC is 09:20 NY in EDT; 14:20 UTC is 09:20 NY in EST.
    # The other slot is a backup: concurrency prevents overlapping sessions.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    # Keep existing classic BREAKOUT end-of-day recovery.
    - cron: "45 19 * * 1-5"
    - cron: "45 20 * * 1-5"
  workflow_dispatch:
    inputs:
      one_paper_trade:
        description: "ONE-SHOT classic PAPER: permit max one new bracket entry attempt"
        type: boolean
        required: false
        default: false
      full_paper_session:
        description: "MANUAL RECOVERY: full PAPER auto trading for this session"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:
  first-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Scan until safe handover
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ENABLE_BREAKOUT_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          BREAKOUT_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            now_epoch=$(date +%s)
            close_epoch=$(python scanner_v25_2.py --close-epoch) || { echo "Calendar error — retrying"; sleep 30; continue; }
            if [ "$close_epoch" -eq 0 ]; then
              echo "No trading session today"
              break
            fi
            # Handover no later than 12:00 NY or 60 minutes before early close.
            regular_handover=$(TZ=America/New_York date -d "$(TZ=America/New_York date +%F) 12:00:00" +%s)
            eod_handover=$((close_epoch - 3600))
            handover=$regular_handover
            if [ "$eod_handover" -lt "$handover" ]; then handover=$eod_handover; fi
            if [ "$now_epoch" -ge "$handover" ]; then
              echo "First-session handover"
              break
            fi
            # Scanner itself waits for market open and refuses trades when closed.
            echo "CLASSIC BREAKOUT V2.5.2 $(TZ=America/New_York date)"
            set +e
            python scanner_v25_2.py
            status=$?
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_v252.json breakout_results_v252.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update classic Breakout V2.5.2 state"
              # Other scanners push to main simultaneously. Retry transient
              # non-fast-forward errors; never force push or erase broker state.
              pushed=0
              for attempt in 1 2 3 4 5 6 7 8; do
                if ! git pull --rebase origin main; then
                  echo "::error::BREAKOUT state rebase failed; preserve local changes and fail closed."
                  exit 1
                fi
                if git push origin HEAD:main; then pushed=1; break; fi
                echo "::warning::Classic state push conflict (attempt $attempt); retrying"
                sleep $((attempt * 2))
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::error::BREAKOUT state failed 8 pushes; abort rather than discard a trade."
                exit 1
              fi
            fi
            if [ "$status" -ne 0 ]; then
              echo "Scanner error $status; retrying in 30s"
              sleep 30
            else
              sleep_sec=$(python scanner_v25_2.py --sleep-seconds 2>/dev/null) || sleep_sec=30
              if ! [[ "$sleep_sec" =~ ^[0-9]+$ ]]; then sleep_sec=30; fi
              echo "Sleeping ${sleep_sec}s"
              sleep "$sleep_sec"
            fi
          done

  second-session:
    needs: first-session
    # Run EOD even after first-session failure; never restart an explicitly canceled session.
    if: ${{ always() && !cancelled() && needs.first-session.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Monitor and liquidate 15min before REAL close
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ENABLE_BREAKOUT_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          BREAKOUT_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            close_epoch=$(python scanner_v25_2.py --close-epoch) || { echo "Calendar error"; sleep 30; continue; }
            if [ "$close_epoch" -eq 0 ]; then
              echo "No trading session"
              break
            fi
            if [ "$(date +%s)" -ge "$close_epoch" ]; then
              echo "Real NY market close reached; final monitor only"
            fi
            echo "CLASSIC BREAKOUT FINAL $(TZ=America/New_York date)"
            set +e
            python scanner_v25_2.py
            status=$?
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_v252.json breakout_results_v252.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update classic Breakout V2.5.2 state and EOD"
              pushed=0
              for attempt in 1 2 3 4 5 6 7 8; do
                if ! git pull --rebase origin main; then
                  echo "::error::BREAKOUT EOD state rebase failed; preserve state for manual recovery."
                  exit 1
                fi
                if git push origin HEAD:main; then pushed=1; break; fi
                echo "::warning::Classic EOD push conflict (attempt $attempt); retrying"
                sleep $((attempt * 2))
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::error::BREAKOUT EOD state failed 8 pushes; abort rather than discard a trade."
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$((close_epoch + 120))" ]; then
              echo "End of EOD monitoring; inspect any Telegram warnings."
              break
            fi
            if [ "$status" -ne 0 ]; then
              sleep 30
            else
              sleep_sec=$(python scanner_v25_2.py --sleep-seconds 2>/dev/null) || sleep_sec=30
              if ! [[ "$sleep_sec" =~ ^[0-9]+$ ]]; then sleep_sec=30; fi
              sleep "$sleep_sec"
            fi
          done
