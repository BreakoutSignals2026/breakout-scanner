name: Launch classic one-shot PAPER
on:
  push:
    paths:
      - ".github/workflows/launch_classic_one_shot.yml"
permissions:
  actions: write
  contents: read
jobs:
  preflight-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Confirm no existing classic-symbol positions or orders
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import scanner_v25_2 as s
          active = set(s.all_positions())
          active.update(o.get("symbol") for o in s.walk_orders(s.open_orders()))
          overlap = set(s.SYMBOLS) & active
          if overlap:
              raise SystemExit("ABORT: Classic-symbol positions/orders exist: " + str(sorted(overlap)))
          if s.one_shot_already_consumed(s.load_state()):
              raise SystemExit("ABORT: prior B252 entry attempt/order found")
          print("Alpaca PAPER read-only preflight PASS.")
          PY
      - name: Stop old SAFE MODE run and dispatch one-shot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}"
          old=39619909543
          state=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/actions/runs/${old}" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$state" != completed ]; then
            status=$(curl -sS -o /tmp/cancel -w "%{http_code}" -X POST -H "Authorization: Bearer ${GH_TOKEN}" "${api}/actions/runs/${old}/force-cancel")
            echo "Cancel old classic: HTTP ${status}"
            if [ "$status" != 202 ] && [ "$status" != 409 ]; then cat /tmp/cancel; exit 1; fi
          fi
          for i in $(seq 1 25); do
            state=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/actions/runs/${old}" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [ "$state" = completed ]; then break; fi
            sleep 3
          done
          if [ "$state" != completed ]; then echo "Old run not stopped, abort."; exit 1; fi
          response=$(curl -sS -o /tmp/dispatch -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"one_paper_trade":"true"}}' \
            "${api}/actions/workflows/scanner.yml/dispatches")
          echo "One-shot classic test dispatch: HTTP ${response}"
          if [ "$response" != 204 ]; then cat /tmp/dispatch; exit 1; fi
