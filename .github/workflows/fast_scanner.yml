name: FAST Alpaca Scanner V3.3.1 (risk-limited PAPER auto)

on:
  schedule:
    # 09:20 America/New_York: 13:20 UTC in EDT, 14:20 UTC in EST.
    # Ten minutes before US market opens (09:30 NY).
    # Preflight validates the cron against NY daylight savings, even after delays.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    # Recovery launches at NY 09:30 (at the regular US market open).
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      one_paper_trade:
        description: "ONE-SHOT PAPER: allow at most one FAST entry (existing protection/EOD stays active)"
        type: boolean
        required: false
        default: false
      full_paper_session:
        description: "MANUAL RECOVERY: resume full PAPER auto trading for this session"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fast-scanner
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Validate DST and allow late GitHub scheduled start
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          NOW_NY=$(TZ=America/New_York date '+%H:%M')
          OFFSET=$(TZ=America/New_York date '+%z')
          WEEKDAY=$(TZ=America/New_York date '+%u')
          HOUR=${NOW_NY:0:2}
          MINUTE=${NOW_NY:3:2}
          NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
          echo "NY=$NOW_NY offset=$OFFSET weekday=$WEEKDAY cron=${SCHEDULE_CRON:-none}"
          if [ "$WEEKDAY" -ge 6 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$NOW_MIN" -ge 540 ] && [ "$NOW_MIN" -lt 960 ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$OFFSET:$SCHEDULE_CRON" in
              "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5")
                if [ "$NOW_MIN" -ge 560 ] && [ "$NOW_MIN" -lt 960 ]; then
                  echo "should_run=true" >> "$GITHUB_OUTPUT"
                else
                  echo "should_run=false" >> "$GITHUB_OUTPUT"
                fi
                ;;
              *)
                echo "Wrong DST regime: no session start"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # Early-close days can end at 13:00 NY. Hand off at noon, not 14:25.
    timeout-minutes: 230
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Scan from US open until 12:00 New York
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Scheduled PAPER auto; manual runs require explicit one_paper_trade. NEVER LIVE.
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST first-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ] || [ "$NOW_MIN" -ge 720 ]; then
              echo "First-session finished."
              break
            fi
            if [ "$NOW_MIN" -lt 570 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl fast_virtual_state_v1.json fast_virtual_signals_v1.jsonl fast_virtual_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ]; then
              echo "No trading session today."
              break
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done

  second-session:
    needs: [preflight, first-session]
    # Run EOD monitoring after scan failure, but honor explicit workflow cancellation.
    # Avoid always(): it can keep the second job alive when the run was canceled.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # 12:00 -> 16:00 (or early-close time), includes setup and verification.
    timeout-minutes: 285
    steps:
      - name: Checkout latest state from repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Monitor, scan and close FAST trades before actual session end
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST second-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ]; then
              break
            fi
            if [ "$NOW_MIN" -lt 720 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl fast_virtual_state_v1.json fast_virtual_signals_v1.jsonl fast_virtual_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ] || [ "$(date +%s)" -ge "$CLOSE_EPOCH" ]; then
              echo "Exchange session ended or market holiday; final scan done."
              break
            fi
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done
