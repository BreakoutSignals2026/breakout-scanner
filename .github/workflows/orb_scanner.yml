name: ORB V1.0 - virtual trades only (NO ALPACA ORDERS)

on:
  schedule:
    # Primary 09:20 NY, fallback 09:30 NY, across both US DST seasons.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orb-simulator-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Check New York trading hours and duplicate DST schedule
        shell: bash
        run: |
          NY_TIME=$(TZ=America/New_York date +%H%M)
          NY_DAY=$(TZ=America/New_York date +%u)
          echo "NY time=$NY_TIME day=$NY_DAY"
          if [ "$NY_DAY" -ge 6 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$NY_TIME" -ge 0900 ] && [ "$NY_TIME" -lt 1600 ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$NY_TIME" -ge 0920 ] && [ "$NY_TIME" -lt 1000 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate or excessively delayed scheduled run skipped."
          fi

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data client
        run: python -m pip install requests
      - name: Scan ORB from 09:45 to 12:00 New York
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          python scanner_orb_v1.py --self-check
          while true; do
            NY_DAY=$(TZ=America/New_York date +%u)
            NY_TIME=$(TZ=America/New_York date +%H%M)
            if [ "$NY_DAY" -ge 6 ] || [ "$NY_TIME" -ge 1200 ]; then
              echo "ORB midday handover."
              break
            fi
            if [ "$NY_TIME" -lt 0945 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_orb_v1.py; then
              echo "::warning::ORB data or simulation cycle failed; retrying with preserved state."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orb_state_v1.json orb_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update ORB V1.0 simulated results and state"
              git pull --no-rebase -X ours origin main
              git push origin HEAD:main
            fi
            sleep 90
          done

  second-session:
    needs: [preflight, first-session]
    # Do not continue after explicit workflow cancellation.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data client
        run: python -m pip install requests
      - name: Monitor virtual ORB exits through actual US exchange close
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          python scanner_orb_v1.py --self-check
          while true; do
            NY_DAY=$(TZ=America/New_York date +%u)
            NY_TIME=$(TZ=America/New_York date +%H%M)
            if [ "$NY_DAY" -ge 6 ]; then
              break
            fi
            if [ "$NY_TIME" -lt 1200 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_orb_v1.py; then
              echo "::warning::ORB data or simulation cycle failed; retrying with preserved state."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orb_state_v1.json orb_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update ORB V1.0 virtual PnL and EOD state"
              git pull --no-rebase -X ours origin main
              git push origin HEAD:main
            fi
            CLOSE_EPOCH=$(python scanner_orb_v1.py --close-epoch) || CLOSE_EPOCH=0
            if [ "$CLOSE_EPOCH" -eq 0 ]; then
              echo "No US session today."
              break
            fi
            if [ "$(date +%s)" -ge "$((CLOSE_EPOCH + 120))" ]; then
              echo "ORB finished EOD monitoring."
              break
            fi
            sleep 90
          done
