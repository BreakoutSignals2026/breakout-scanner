name: EQUITY IEX 5Min recorder + quality (READ ONLY)

on:
  push:
    paths:
      - "scanner_equity_observer_v1.py"
      - ".github/workflows/equity_observer.yml"
  schedule:
    # Independent read-only observer; backfills all of today's regular session.
    # Delayed GitHub schedules do not discard earlier IEX candles.
    - cron: "7,27,47 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equity-iex-observer-v1
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Record observed CLOSED 5Min IEX candles; NEVER send PAPER orders
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -u scanner_equity_observer_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          added=()
          for f in equity_iex_candles_v1.csv equity_iex_quality_v1.csv; do
            if [[ -f "$f" ]]; then added+=("$f"); fi
          done
          if ((${#added[@]})); then git add -- "${added[@]}"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update read-only IEX five-minute candle and quality journal"
            for attempt in 1 2 3 4 5; do
              git pull --no-rebase -X ours origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "::warning::IEX recorder push race; retry $attempt"
              sleep 3
            done
            echo "::error::IEX observer journal could not be pushed"
            exit 1
          fi
