name: FAST MICRO V1.0 - US stock virtual $1 risk (NO ALPACA ORDERS)

on:
  schedule:
    # Restore the original daily launch pair used before the recovery-cron changes.
    # 13:10 UTC is 09:10 NY in EDT; 14:10 UTC is 09:10 NY in EST.
    # The other slot is a backup: concurrency prevents overlapping sessions.
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-micro-virtual-v1
  cancel-in-progress: false

jobs:
  first-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 09:30 to 12:00 NY
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: first
        shell: bash
        run: bash scripts/fast_micro_session.sh

  second-session:
    needs: first-session
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 12:00 to close, including early close
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: second
        shell: bash
        run: bash scripts/fast_micro_session.sh
