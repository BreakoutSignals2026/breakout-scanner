name: ORB V1.0 - virtual trades only (NO ALPACA ORDERS)

on:
  schedule:
    # Primary 09:20 NY, fallback 09:30 NY, across both US DST seasons.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    # Extra recovery at 09:40/09:50 New York if GitHub delays opening triggers.
    - cron: "40,50 13 * * 1-5"
    - cron: "40,50 14 * * 1-5"
    # Additional 09:40 and 10:00 NY recovery crons; duplicate runs are serialized.
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orb-simulator-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Check New York trading hours and duplicate DST schedule
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          NOW_NY=$(TZ=America/New_York date '+%H:%M')
          OFFSET=$(TZ=America/New_York date +%z)
          WEEKDAY=$(TZ=America/New_York date +%u)
          HH=${NOW_NY:0:2}
          MM=${NOW_NY:3:2}
          NOW_MIN=$((10#$HH * 60 + 10#$MM))
          echo "ORB gate: NY=$NOW_NY offset=$OFFSET event=$GITHUB_EVENT_NAME cron=${SCHEDULE_CRON:-none}"
          should_run=false
          if [ "$WEEKDAY" -lt 6 ] && [ "$NOW_MIN" -ge 560 ] && [ "$NOW_MIN" -lt 945 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              should_run=true
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              case "$OFFSET:$SCHEDULE_CRON" in
                "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0400:40 13 * * 1-5"|"-0400:0 14 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5"|"-0500:40 14 * * 1-5"|"-0500:0 15 * * 1-5")
                  should_run=true
                  ;;
                *)
                  echo "ORB: wrong US DST schedule rejected."
                  ;;
              esac
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "true" ]; then
            echo "ORB accepted current NY session. Fresh 5min signals only; no retroactive fills."
          else
            echo "ORB skipped: weekend, EOD, or wrong DST cron."
          fi
  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data client
        run: python -m pip install requests
      - name: Scan ORB from 09:45 to 12:00 New York
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          python scanner_orb_v1.py --self-check
          while true; do
            NY_DAY=$(TZ=America/New_York date +%u)
            NY_TIME=$(TZ=America/New_York date +%H%M)
            if [ "$NY_DAY" -ge 6 ] || [ "$NY_TIME" -ge 1200 ]; then
              echo "ORB midday handover."
              break
            fi
            if [ "$NY_TIME" -lt 0945 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_orb_v1.py; then
              echo "::warning::ORB data or simulation cycle failed; retrying with preserved state."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orb_state_v1.json orb_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update ORB V1.0 simulated results and state"
              git pull --no-rebase -X ours origin main
              git push origin HEAD:main
            fi
            sleep 90
          done

  second-session:
    needs: [preflight, first-session]
    # Do not continue after explicit workflow cancellation.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data client
        run: python -m pip install requests
      - name: Monitor virtual ORB exits through actual US exchange close
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          python scanner_orb_v1.py --self-check
          while true; do
            NY_DAY=$(TZ=America/New_York date +%u)
            NY_TIME=$(TZ=America/New_York date +%H%M)
            if [ "$NY_DAY" -ge 6 ]; then
              break
            fi
            if [ "$NY_TIME" -lt 1200 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_orb_v1.py; then
              echo "::warning::ORB data or simulation cycle failed; retrying with preserved state."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orb_state_v1.json orb_results_v1.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update ORB V1.0 virtual PnL and EOD state"
              git pull --no-rebase -X ours origin main
              git push origin HEAD:main
            fi
            CLOSE_EPOCH=$(python scanner_orb_v1.py --close-epoch) || CLOSE_EPOCH=0
            if [ "$CLOSE_EPOCH" -eq 0 ]; then
              echo "No US session today."
              break
            fi
            if [ "$(date +%s)" -ge "$((CLOSE_EPOCH + 120))" ]; then
              echo "ORB finished EOD monitoring."
              break
            fi
            sleep 90
          done
