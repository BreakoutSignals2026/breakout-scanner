name: Validate FAST automatic PAPER limits
on:
  push:
    paths:
      - ".github/workflows/validate_fast_auto_limits.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Verify risk guards offline with mocked Alpaca
        run: |
          set -euo pipefail
          python -m py_compile scanner_fast.py
          python - <<'PY'
          from unittest.mock import patch
          import scanner_fast as s
          from datetime import timedelta
          assert s.VERSION == "3.2.2"
          assert s.MAX_FAST_ACTIVE_POSITIONS == 1
          assert s.MAX_FAST_NEW_ENTRIES_PER_NY_DAY == 2
          state = {"trades": {}, "last_signal_bar": {}, "version": s.VERSION}
          with patch.object(s, "api", return_value=[]):
              ok, detail = s.automatic_entry_limits(state, {})
              assert ok and "0/2" in detail, detail
              ok, detail = s.automatic_entry_limits(state, {"RIOT": {"qty": "10"}})
              assert not ok and "1/1" in detail, detail
          today = s.stamp()
          state["trades"] = {"RIOT": {
              "entry_cid": "FAST31E_RIOT_A", "submitted_at": today, "status": "closed"
          }}
          history = [{"client_order_id": "FAST31E_RIOT_A"},
                     {"client_order_id": "FAST31E_SOFi_B"}]
          with patch.object(s, "api", return_value=history):
              ok, detail = s.automatic_entry_limits(state, {})
              assert not ok and "2/2" in detail, detail
          with patch.object(s, "api", return_value=[]):
              ok, detail = s.automatic_entry_limits(state, {})
              assert ok and "1/2" in detail, detail
          with patch.object(s, "api", return_value=[{}]*500):
              try:
                  s.automatic_entry_limits(state, {})
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("Truncated Alpaca order list must fail closed")
          with patch.object(s, "api", side_effect=RuntimeError("API unavailable")):
              try:
                  s.automatic_entry_limits(state, {})
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("API errors must fail closed")
          print("PASS: guards, daily cap, active cap, persistence and API fail-closed")
          PY
