name: FAST MICRO V1.0 - US stock virtual $1 risk (NO ALPACA ORDERS)

on:
  schedule:
    # 09:20 NY primary; 09:30/09:40/09:50/10:00 NY retries, Monday-Friday.
    # UTC schedules cover both US DST regimes; preflight selects the correct one.
    # Each retry is separate so github.event.schedule matches its allowlist.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "50 13 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-micro-virtual-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Validate weekday, NY time window and original DST schedule
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          ny_time=$(TZ=America/New_York date +%H:%M)
          ny_offset=$(TZ=America/New_York date +%z)
          ny_weekday=$(TZ=America/New_York date +%u)
          ny_hour=${ny_time%:*}
          ny_minute=${ny_time#*:}
          now_min=$((10#$ny_hour * 60 + 10#$ny_minute))
          echo "NY time=$ny_time offset=$ny_offset weekday=$ny_weekday event=$GITHUB_EVENT_NAME cron=${SCHEDULE_CRON:-none}"

          # Shared gate: weekdays, manual 09:00-16:00 NY, scheduled 09:20-16:00 NY.
          # The scanner's Alpaca calendar still handles holidays and actual early closes.
          allow=false
          if [ "$ny_weekday" -lt 6 ] && [ "$now_min" -ge 540 ] && [ "$now_min" -lt 960 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              allow=true
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$now_min" -ge 560 ]; then
              # Validate the original cron against today's NY UTC offset, not arrival hour.
              # Correct-season late arrivals are accepted until 16:00 NY; unknown crons fail closed.
              case "$ny_offset:$SCHEDULE_CRON" in
                "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0400:40 13 * * 1-5"|"-0400:50 13 * * 1-5"|"-0400:0 14 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5"|"-0500:40 14 * * 1-5"|"-0500:50 14 * * 1-5"|"-0500:0 15 * * 1-5")
                  allow=true
                  ;;
                *)
                  echo "Skipped: wrong DST-season or unknown cron."
                  ;;
              esac
            fi
          fi
          echo "Gate: allow=$allow"
          echo "should_run=$allow" >> "$GITHUB_OUTPUT"

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 09:30 to 12:00 NY
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: first
        shell: bash
        run: bash scripts/fast_micro_session.sh

  second-session:
    needs: [preflight, first-session]
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Virtual-only MICRO from 12:00 to close, including early close
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MICRO_SESSION_PHASE: second
        shell: bash
        run: bash scripts/fast_micro_session.sh
