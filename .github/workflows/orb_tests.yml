name: ORB V1.0 - regression tests (NO TRADING)

on:
  push:
    paths:
      - "scanner_orb_v1.py"
      - "tests/test_orb_v1.py"
      - ".github/workflows/orb_scanner.yml"
      - ".github/workflows/orb_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Compile strategy and verify no trade calls
        run: |
          python -m py_compile scanner_orb_v1.py tests/test_orb_v1.py
          python scanner_orb_v1.py --self-check
      - name: Run no-credentials simulator tests
        run: python -m unittest discover -s tests -p 'test_orb_v1.py' -v
