name: ORB + FAST guardrail regression tests (NO TRADING)

on:
  push:
    paths:
      - "scripts/us_start_recovery.py"
      - "tests/test_us_start_recovery.py"
      - ".github/workflows/us_start_recovery.yml"
      - "equity_iex_research_v1.py"
      - "tests/test_equity_iex_research_v1.py"
      - "scanner_equity_observer_v1.py"
      - "tests/test_equity_observer_v1.py"
      - ".github/workflows/equity_observer.yml"
      - "scanner_orb_v1.py"
      - "tests/test_orb_v1.py"
      - "scanner_fast.py"
      - "equity_candle_guard.py"
      - "tests/test_equity_candle_integrity.py"
      - "fast_virtual.py"
      - "scanner_v25_2.py"
      - "tests/test_classic_diagnostics.py"
      - "tests/test_breakout_recovery.py"
      - ".github/workflows/scanner.yml"
      - "tests/test_fast_virtual.py"
      - "tests/test_fast_guardrails.py"
      - ".github/workflows/fast_scanner.yml"
      - ".github/workflows/fast_micro_scanner.yml"
      - "scripts/fast_micro_session.sh"
      - "fast_micro_v1.py"
      - "scanner_fast_micro_v1.py"
      - "tests/test_fast_micro_v1.py"
      - ".github/workflows/orb_scanner.yml"
      - ".github/workflows/orb_tests.yml"
      - "market_virtual_core.py"
      - "crypto_paper_v1.py"
      - "tests/test_crypto_paper_fills.py"
      - "scanner_crypto_v1.py"
      - "crypto_observer_v1.py"
      - "crypto_crossfeed_v1.py"
      - "tests/test_crypto_crossfeed.py"
      - "tests/test_crypto_observer.py"
      - "scanner_xetra_v1.py"
      - "tests/test_global_markets.py"
      - "scripts/crypto_session_loop.sh"
      - "equity_candle_guard.py"
      - "tests/test_scanner_reliability.py"
      - "tests/test_crypto_session.py"
      - ".github/workflows/crypto_scanner.yml"
      - ".github/workflows/xetra_scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Compile strategy and verify no trade calls
        run: |
          python -m py_compile equity_iex_research_v1.py scanner_equity_observer_v1.py equity_candle_guard.py scanner_fast.py fast_virtual.py fast_micro_v1.py scanner_fast_micro_v1.py scanner_v25_2.py scanner_orb_v1.py market_virtual_core.py crypto_paper_v1.py crypto_observer_v1.py crypto_crossfeed_v1.py scanner_crypto_v1.py scanner_xetra_v1.py tests/test_*.py
          python -m py_compile scripts/us_start_recovery.py
          bash -n scripts/crypto_session_loop.sh
          bash -n scripts/fast_micro_session.sh
          python scanner_orb_v1.py --self-check
      - name: Run no-credentials simulator tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
