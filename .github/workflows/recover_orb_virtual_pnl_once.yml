name: Recover ORB 2026-10-22 hypothetical exits from verified morning snapshot
on:
  push:
    paths:
      - ".github/workflows/recover_orb_virtual_pnl_once.yml"
permissions:
  actions: write
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install market read client
        run: python -m pip install requests
      - name: Stop old ORB simulation run so outdated state cannot overwrite restored outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.github.com/repos/$GH_REPOSITORY"
          code=$(curl --silent --show-error --location -o /tmp/cancel -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ROOT/actions/runs/39801497240/cancel")
          echo "Request stop old ORB run: HTTP $code"
          if [ "$code" != 202 ] && [ "$code" != 409 ]; then
            cat /tmp/cancel
            exit 1
          fi
          for i in $(seq 1 15); do
            status=$(curl --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ROOT/actions/runs/39801497240" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "Old ORB run status: $status"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "Old ORB still active; refuse state modification" >&2
          exit 1
      - name: Replay only two known virtual trades to 15:45 NY using IEX closed candles (NO ALPACA ORDERS)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, subprocess, shutil
          from pathlib import Path
          from datetime import timedelta
          import scanner_orb_v1 as orb
          H='6fb3e81485e667232376fd6ca0998e64f2baeb00'
          previous=json.loads(subprocess.check_output(
              ['git','show',H+':orb_state_v1.json'],text=True))
          main=json.loads(Path('orb_state_v1.json').read_text())
          if previous.get('session_date')!='2026-10-22' or main.get('session_date')!='2026-10-22':
              raise RuntimeError('Session date mismatch')
          names=['RIVN','FSLY']
          for name in names:
              rec=previous['symbols'].get(name)
              if not rec or rec.get('phase')!='open' or not rec.get('trade',{}).get('trade_id'):
                  raise RuntimeError('Missing verified virtual historical trade '+name)
          if any(rec.get('phase') not in {'watching','closed'}
                 for rec in main.get('symbols',{}).values()):
              raise RuntimeError('New ORB state has unexpected unresolved trades; refuse overwrite')
          with Path('orb_results_v1.csv').open(newline='') as f:
              current=list(csv.DictReader(f))
          if current:
              raise RuntimeError('Current ORB results already exist; refuse clobber')
          session=orb.get_session(orb.now_ny())
          if not session or session['day']!='2026-10-22' or orb.now_ny() < session['liquidate']:
              raise RuntimeError('Not yet after real EOD target or wrong session')
          bars_raw=orb.get_bars(names,session['open'],orb.now_ny())
          # Reconstruct AS OF EOD liquidation time, not later candles.
          model_now=session['liquidate']+timedelta(seconds=30)
          outcomes={}
          def silent_notify(msg): print('HISTORICAL SIM ONLY:',msg)
          orb.notify=silent_notify
          # Work only in local files until both outcomes have been verified.
          for name in names:
              candles=orb.closed_bars(bars_raw.get(name,[]),session,model_now)
              opening=orb.get_opening_range(candles,session)
              if opening is None:
                  raise RuntimeError('Opening range candles unavailable for '+name)
              recovered=orb.update_symbol(name,candles,session,model_now,previous['symbols'][name])
              if recovered.get('phase')!='closed':
                  raise RuntimeError('Could not verify hypothetical EOD exit for '+name+
                      '; refusing to invent a result')
              outcomes[name]=recovered
              print('VERIFIED ORB',name,recovered['result'])
          with Path('orb_results_v1.csv').open(newline='') as f:
              logged=list(csv.DictReader(f))
          if len(logged)!=2 or {v['symbol'] for v in logged}!=set(names):
              raise RuntimeError('ORB simulated result count mismatch')
          for name,value in outcomes.items():
              previous['symbols'][name]=value
          previous['restored_from_commit']=H
          previous['restoration_is_hypothetical']=True
          previous['daily_summary_sent']=True
          orb.save_state(previous)
          count,wins,losses,pnl=orb.daily_summary(session['day'])
          print('ORB RECOVERED SUMMARY:',count,'trades',wins,'wins',losses,'losses',pnl,'USD')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_state_v1.json orb_results_v1.csv
          if git diff --cached --quiet; then
            echo "No virtual trade changes to commit"
            exit 1
          fi
          git commit -m "Recover 2026-10-22 historical ORB virtual exit PnL from closed IEX bars"
          git pull --rebase origin main
          git push origin HEAD:main
