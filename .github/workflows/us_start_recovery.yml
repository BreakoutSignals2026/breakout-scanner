name: US start watchdog and protected recovery (PAPER only)

on:
  workflow_run:
    workflows:
      - "EQUITY IEX 5Min recorder + quality (READ ONLY)"
      - "ORB + FAST guardrail regression tests (NO TRADING)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: us-start-watchdog-v1
  cancel-in-progress: false

jobs:
  recover-starts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Alpaca market calendar and actual US startup jobs before dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python -u scripts/us_start_recovery.py
