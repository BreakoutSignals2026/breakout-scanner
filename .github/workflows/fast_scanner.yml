name: FAST Alpaca Scanner V3.3.1 (risk-limited PAPER auto)

on:
  schedule:
    # 09:20 NY primary; 09:30/09:40/09:50/10:00 NY retries, Monday-Friday.
    # UTC schedules cover both US DST regimes; preflight selects the correct one.
    # Each retry is separate so github.event.schedule matches its allowlist.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "50 13 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      one_paper_trade:
        description: "ONE-SHOT PAPER: allow at most one FAST entry (existing protection/EOD stays active)"
        type: boolean
        required: false
        default: false
      full_paper_session:
        description: "MANUAL RECOVERY: resume full PAPER auto trading for this session"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fast-scanner
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Validate weekday, NY time window and original DST schedule
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          ny_time=$(TZ=America/New_York date +%H:%M)
          ny_offset=$(TZ=America/New_York date +%z)
          ny_weekday=$(TZ=America/New_York date +%u)
          ny_hour=${ny_time%:*}
          ny_minute=${ny_time#*:}
          now_min=$((10#$ny_hour * 60 + 10#$ny_minute))
          echo "NY time=$ny_time offset=$ny_offset weekday=$ny_weekday event=$GITHUB_EVENT_NAME cron=${SCHEDULE_CRON:-none}"

          # Shared gate: weekdays, manual 09:00-16:00 NY, scheduled 09:20-16:00 NY.
          # The scanner's Alpaca calendar still handles holidays and actual early closes.
          allow=false
          if [ "$ny_weekday" -lt 6 ] && [ "$now_min" -ge 540 ] && [ "$now_min" -lt 960 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              allow=true
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$now_min" -ge 560 ]; then
              # Validate the original cron against today's NY UTC offset, not arrival hour.
              # Correct-season late arrivals are accepted until 16:00 NY; unknown crons fail closed.
              case "$ny_offset:$SCHEDULE_CRON" in
                "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0400:40 13 * * 1-5"|"-0400:50 13 * * 1-5"|"-0400:0 14 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5"|"-0500:40 14 * * 1-5"|"-0500:50 14 * * 1-5"|"-0500:0 15 * * 1-5")
                  allow=true
                  ;;
                *)
                  echo "Skipped: wrong DST-season or unknown cron."
                  ;;
              esac
            fi
          fi
          echo "Gate: allow=$allow"
          echo "should_run=$allow" >> "$GITHUB_OUTPUT"

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # Early-close days can end at 13:00 NY. Hand off at noon, not 14:25.
    timeout-minutes: 230
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Scan from US open until 12:00 New York
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Scheduled PAPER auto; manual runs require explicit one_paper_trade. NEVER LIVE.
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST first-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ] || [ "$NOW_MIN" -ge 720 ]; then
              echo "First-session finished."
              break
            fi
            if [ "$NOW_MIN" -lt 570 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ]; then
              echo "No trading session today."
              break
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done

  second-session:
    needs: [preflight, first-session]
    # Run EOD monitoring after scan failure, but honor explicit workflow cancellation.
    # Avoid always(): it can keep the second job alive when the run was canceled.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    # 12:00 -> 16:00 (or early-close time), includes setup and verification.
    timeout-minutes: 285
    steps:
      - name: Checkout latest state from repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Monitor, scan and close FAST trades before actual session end
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_FAST_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          FAST_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        run: |
          set -e
          while true; do
            NY_TIME=$(TZ=America/New_York date '+%H:%M:%S')
            NY_DAY=$(TZ=America/New_York date '+%u')
            HOUR=${NY_TIME:0:2}
            MINUTE=${NY_TIME:3:2}
            NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
            echo "FAST second-session: NY $NY_TIME"
            if [ "$NY_DAY" -ge 6 ]; then
              break
            fi
            if [ "$NOW_MIN" -lt 720 ]; then
              sleep 30
              continue
            fi
            if ! python scanner_fast.py; then
              echo "::warning::FAST scan/monitor API error. Retrying on next 270s cycle."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_fast_v31.json breakout_trades_fast_v31.jsonl 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update FAST V3.3.1 state"
              git pull --no-rebase -X ours origin main
              git push origin main
            fi
            # Sleep at most 270 seconds, but wake exactly at the real
            # (possibly shortened) session close-minus-15-min threshold.
            CLOSE_EPOCH=$(python scanner_fast.py --close-epoch)
            if [ "$CLOSE_EPOCH" -eq 0 ] || [ "$(date +%s)" -ge "$CLOSE_EPOCH" ]; then
              echo "Exchange session ended or market holiday; final scan done."
              break
            fi
            PAUSE=$(python scanner_fast.py --sleep-seconds)
            sleep "$PAUSE"
          done
