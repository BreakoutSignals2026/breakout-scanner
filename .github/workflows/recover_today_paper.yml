name: Recover missed PAPER scanner schedule
on:
  push:
    paths:
      - ".github/workflows/recover_today_paper.yml"

permissions:
  actions: write
  contents: read

jobs:
  start-both:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch FAST and classic full-session PAPER
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in fast_scanner.yml scanner.yml; do
            response=$(curl --silent --show-error --location \
              --output /tmp/dispatch_result --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data '{"ref":"main","inputs":{"one_paper_trade":"false","full_paper_session":"true"}}' \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/${wf}/dispatches")
            echo "${wf}: HTTP ${response}"
            if [ "${response}" != "204" ]; then
              cat /tmp/dispatch_result
              exit 1
            fi
          done
          echo "Both full-session PAPER recovery requests accepted."
