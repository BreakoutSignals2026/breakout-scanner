name: Breakout Scanner V2.5.2 (PAPER auto)

on:
  schedule:
    # 09:20 / 09:30 New York launches for both DST regimes.
    # Preflight checks github.event.schedule against the actual NY UTC offset,
    # so a GitHub delay cannot turn the wrong-season 10:20/10:30 cron into a trade.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    # Extra recovery at 09:40/09:50 New York if GitHub delays opening triggers.
    - cron: "40,50 13 * * 1-5"
    - cron: "40,50 14 * * 1-5"
    # Additional 09:40 and 10:00 NY recovery crons; duplicate runs are serialized.
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      one_paper_trade:
        description: "ONE-SHOT classic PAPER: permit max one new bracket entry attempt"
        type: boolean
        required: false
        default: false
      full_paper_session:
        description: "MANUAL RECOVERY: full PAPER auto trading for this session"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        name: Validate DST cron and allow delayed NY-session start
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          ny_time=$(TZ=America/New_York date +%H:%M)
          ny_offset=$(TZ=America/New_York date +%z)
          ny_weekday=$(TZ=America/New_York date +%u)
          ny_hour=${ny_time%:*}
          ny_minute=${ny_time#*:}
          now_min=$((10#$ny_hour * 60 + 10#$ny_minute))
          echo "NY time=$ny_time offset=$ny_offset weekday=$ny_weekday event=$GITHUB_EVENT_NAME cron=${SCHEDULE_CRON:-none}"

          # Preserve manual recovery: its PAPER trading mode is controlled by
          # the existing workflow_dispatch inputs, unchanged below.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$ny_weekday" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Accept only the cron belonging to today's New York DST regime.
          # A late 09:20/09:30 launch stays valid even if GitHub starts it
          # after 10:00; the 10:20/10:30 wrong-season launch stays blocked.
          case "$ny_offset:$SCHEDULE_CRON" in
            "-0400:20 13 * * 1-5"|"-0400:30 13 * * 1-5"|"-0400:40 13 * * 1-5"|"-0400:0 14 * * 1-5"|"-0500:20 14 * * 1-5"|"-0500:30 14 * * 1-5"|"-0500:40 14 * * 1-5"|"-0500:0 15 * * 1-5")
              echo "Correct DST-season schedule."
              ;;
            *)
              echo "Skipped wrong-season or unknown schedule."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Permit GitHub Actions delays throughout the NY trading session.
          # After the close, delayed/queued invocations cannot start a new run.
          # Existing scanner code still enforces the exchange calendar,
          # last-entry cutoff, order safeguards and EOD liquidation.
          if [ "$now_min" -ge 560 ] && [ "$now_min" -lt 960 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: outside 09:20-16:00 New York."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  first-session:
    needs: preflight
    if: ${{ needs.preflight.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Scan until safe handover
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ENABLE_BREAKOUT_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          BREAKOUT_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            now_epoch=$(date +%s)
            close_epoch=$(python scanner_v25_2.py --close-epoch) || { echo "Calendar error — retrying"; sleep 30; continue; }
            if [ "$close_epoch" -eq 0 ]; then
              echo "No trading session today"
              break
            fi
            # Handover no later than 14:45 NY or 60 minutes before early close.
            regular_handover=$(TZ=America/New_York date -d "$(TZ=America/New_York date +%F) 14:45:00" +%s)
            eod_handover=$((close_epoch - 3600))
            handover=$regular_handover
            if [ "$eod_handover" -lt "$handover" ]; then handover=$eod_handover; fi
            if [ "$now_epoch" -ge "$handover" ]; then
              echo "First-session handover"
              break
            fi
            # Scanner itself waits for market open and refuses trades when closed.
            echo "CLASSIC BREAKOUT V2.5.2 $(TZ=America/New_York date)"
            set +e
            python scanner_v25_2.py
            status=$?
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_v252.json breakout_results_v252.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update classic Breakout V2.5.2 state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            if [ "$status" -ne 0 ]; then
              echo "Scanner error $status; retrying in 30s"
              sleep 30
            else
              sleep_sec=$(python scanner_v25_2.py --sleep-seconds 2>/dev/null) || sleep_sec=30
              if ! [[ "$sleep_sec" =~ ^[0-9]+$ ]]; then sleep_sec=30; fi
              echo "Sleeping ${sleep_sec}s"
              sleep "$sleep_sec"
            fi
          done

  second-session:
    needs: [preflight, first-session]
    # Keep EOD monitor after scan failure but honor explicit run cancellation.
    if: ${{ !cancelled() && needs.preflight.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          # Always read latest persisted trading state, not workflow trigger SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Monitor and liquidate 15min before REAL close
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ENABLE_BREAKOUT_TRADING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.one_paper_trade == true || inputs.full_paper_session == true) && 'true' || 'false') }}
          BREAKOUT_ONE_SHOT_PAPER_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.one_paper_trade == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            close_epoch=$(python scanner_v25_2.py --close-epoch) || { echo "Calendar error"; sleep 30; continue; }
            if [ "$close_epoch" -eq 0 ]; then
              echo "No trading session"
              break
            fi
            if [ "$(date +%s)" -ge "$close_epoch" ]; then
              echo "Real NY market close reached; final monitor only"
            fi
            echo "CLASSIC BREAKOUT FINAL $(TZ=America/New_York date)"
            set +e
            python scanner_v25_2.py
            status=$?
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add breakout_state_v252.json breakout_results_v252.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update classic Breakout V2.5.2 state and EOD"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            if [ "$(date +%s)" -ge "$((close_epoch + 120))" ]; then
              echo "End of EOD monitoring; inspect any Telegram warnings."
              break
            fi
            if [ "$status" -ne 0 ]; then
              sleep 30
            else
              sleep_sec=$(python scanner_v25_2.py --sleep-seconds 2>/dev/null) || sleep_sec=30
              if ! [[ "$sleep_sec" =~ ^[0-9]+$ ]]; then sleep_sec=30; fi
              sleep "$sleep_sec"
            fi
          done